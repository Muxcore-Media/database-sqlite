services:
  database-sqlite:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9700"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: database-sqlite
      SQLITE_DB_PATH: /data/muxcore.db
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
